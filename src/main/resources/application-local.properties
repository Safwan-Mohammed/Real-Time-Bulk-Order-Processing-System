spring.datasource.url=jdbc:h2:mem:bulk_order_db;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Local API testing has no Kafka broker. HTTP endpoints remain available, but
# asynchronous payment and confirmation processing is intentionally disabled.
app.kafka.enabled=false
