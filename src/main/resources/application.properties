spring.application.name=bulk-order
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/bulk_order_DB?createTableIfNotExists=true
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=localhost:9092

# JWT_SECRET must be a securely generated Base64 key. It is loaded from .env locally
# and should be injected as an environment variable when deployed.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
